name: Bug Report
description: Create a report to help us fix a bug in the SDK, CLI, or MCP server
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with the BatchIn developer resources!
  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      options:
        - "@batchin/sdk (packages/sdk-ts)"
        - "batchin (packages/sdk-python)"
        - "@batchin/cli (packages/cli-ts)"
        - "batchin-mcp-server (packages/mcp-server)"
        - "@batchin/vaas (packages/vaas-sdk-ts)"
        - "batchin-vaas (packages/vaas-sdk-python)"
        - "@batchin/contracts (packages/contracts)"
        - "Documentation / Agent Rules"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal code sample to reproduce the behavior.
      placeholder: |
        1. Initialize client
        2. Call method ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, Python version, OS, etc.
      placeholder: |
        - OS: macOS 14.5 / Ubuntu 22.04
        - Node: 20.12.0
        - Python: 3.11.8
