name: CI Monorepo Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compliance-and-security:
    name: Compliance & Export Control Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run compliance scan
        run: python3 scripts/scan_compliance.py

  typescript-packages:
    name: TypeScript Build & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Typecheck all workspace packages
        run: npm run typecheck
      - name: Build all workspace packages
        run: npm run build
      - name: Run workspace tests
        run: npm run test

  python-packages:
    name: Python Packages Packaging & Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip build hatchling
      - name: Test build batchin-mcp-server
        run: |
          cd packages/mcp-server
          python -m build
      - name: Test build batchin-vaas
        run: |
          cd packages/vaas-sdk-python
          python -m build
      - name: Test build batchin
        run: |
          cd packages/sdk-python
          python -m build
