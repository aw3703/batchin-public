name: Release Packages

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ts
      - run: python -m pip install build
      - run: python -m pytest
      - run: python -m build packages/sdk-python
      - run: python -m build packages/vaas-sdk-python
      - run: python -m build packages/mcp-server
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: packages/*/dist/*

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sdk-ts, ai-sdk, cli-ts, vaas-sdk-ts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --workspace packages/${{ matrix.package }} --access public --provenance

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
