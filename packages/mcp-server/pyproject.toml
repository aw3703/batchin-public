[project]
name = "batchin-mcp-server"
version = "0.1.0"
description = "BatchIn MCP connector for authenticated developer workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["batchin", "mcp", "model-context-protocol", "ai", "integration"]

[project.urls]
Homepage = "https://batchin.tech"
Repository = "https://github.com/aw3703/batchin-public"
Documentation = "https://batchin.tech/agents.md"
MCPManifest = "https://batchin.tech/.well-known/mcp"

[project.scripts]
batchin-mcp-server = "batchin_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
