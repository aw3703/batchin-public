[project]
name = "batchin"
version = "0.1.0"
description = "BatchIn Python SDK for authenticated API workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
keywords = ["batchin", "ai", "sdk", "integration"]

[project.urls]
Homepage = "https://batchin.tech"
Repository = "https://github.com/aw3703/batchin-public"
Documentation = "https://batchin.tech/agents.md"
Issues = "https://github.com/aw3703/batchin-public/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
