[project]
name = "batchin"
version = "0.1.0"
description = "Official BatchIn Python SDK for OpenAI-compatible inference and VaaS receipt verification"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0,<1",
]
keywords = ["batchin", "ai", "inference", "sdk", "openai-compatible", "vaas"]

[project.urls]
Homepage = "https://batchin.tech"
Repository = "https://github.com/aw3703/batchin-public"
Documentation = "https://batchin.tech/agents.md"
Issues = "https://github.com/aw3703/batchin-public/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

