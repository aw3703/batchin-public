[project]
name = "batchin-vaas"
version = "0.1.0"
description = "BatchIn Python integration client for authenticated developer workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyNaCl>=1.5,<2"]
keywords = ["batchin", "ai", "integration", "sdk"]

[project.urls]
Homepage = "https://batchin.tech"
Repository = "https://github.com/aw3703/batchin-public"
Documentation = "https://batchin.tech/agents.md"
Issues = "https://github.com/aw3703/batchin-public/issues"

[project.scripts]
batchin-vaas-verify = "batchin_vaas.verifier:main"
